name: Patch Ana White ladder construction

on:
  push:
    paths:
      - '.github/workflows/patch-ana-white-plan.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<label>Rails / liaisons</label>','<label>Tasseaux porteurs / liaisons</label>')
          s=re.sub(
              r'<div class="note">Principe :.*?</div>',
              '<div class="note">Construction type <b>rack “ladder” Ana White</b> : chaque séparation est formée de deux montants avant/arrière. À chaque niveau, un <b>tasseau porteur</b> est vissé sur le côté de la séparation et relie les deux montants. Les séparations centrales reçoivent un tasseau de chaque côté ; les deux séparations extérieures seulement côté intérieur. La caisse coulisse et porte sur son rebord supérieur.</div>',
              s,
              count=1,
              flags=re.S,
          )

          s=s.replace("{name:'Glissières porteuses (2 par caisse)'", "{name:'Tasseaux porteurs latéraux (2 par caisse)'")
          s=s.replace(",{name:'Traverses supérieures avant-arrière',qty:(cols+1),len:clearD,section:`${rW}×${rH}`}","")

          front="""function drawFront(svg,c){const{W,H,cols,rows,uW,rW,rH,binW,binH,gapX,gapY,bottom}=c,pad=28,vw=700,vh=250,k=Math.min((vw-2*pad)/W,(vh-2*pad)/H),ox=(vw-W*k)/2,oy=(vh-H*k)/2;let s='',rect=(x,y,w,h,f,st='#333')=>`<rect x=\"${ox+x*k}\" y=\"${oy+(H-y-h)*k}\" width=\"${w*k}\" height=\"${h*k}\" fill=\"${f}\" stroke=\"${st}\"/>`;for(let i=0;i<=cols;i++)s+=rect(i*(binW+gapX+uW),0,uW,H,'#c7b28a','#6d5c3b');s+=rect(0,0,W,rH,'#bda578','#6d5c3b')+rect(0,H-rH,W,rH,'#bda578','#6d5c3b');for(let r=0;r<rows;r++){const binY=bottom+r*(binH+gapY),runnerY=binY+binH-rH;for(let i=0;i<cols;i++){const leftPost=i*(binW+gapX+uW),rightPost=(i+1)*(binW+gapX+uW),binX=leftPost+uW+gapX/2;s+=rect(leftPost+uW,runnerY,rW,rH,'#d4b777','#6d5c3b')+rect(rightPost-rW,runnerY,rW,rH,'#d4b777','#6d5c3b')+rect(binX,binY,binW,binH,'#e9ecef','#aaa')}}s+=`<text x=\"${vw/2}\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\">${Math.round(W)} mm</text>`;svg.innerHTML=s}"""

          side="""function drawSide(svg,c){const{D,H,rows,binD,binH,gapD,gapY,bottom,uD,rH}=c,pad=28,vw=380,vh=250,k=Math.min((vw-2*pad)/D,(vh-2*pad)/H),ox=(vw-D*k)/2,oy=(vh-H*k)/2;let s='',rect=(x,y,w,h,f,st='#333')=>`<rect x=\"${ox+x*k}\" y=\"${oy+(H-y-h)*k}\" width=\"${w*k}\" height=\"${h*k}\" fill=\"${f}\" stroke=\"${st}\"/>`,zFront=rH,zRear=D-rH-uD,runnerD=(zRear+uD)-zFront;s+=rect(zFront,0,uD,H,'#c7b28a','#6d5c3b')+rect(zRear,0,uD,H,'#c7b28a','#6d5c3b');s+=rect(0,0,rH,rH,'#bda578','#6d5c3b')+rect(D-rH,0,rH,rH,'#bda578','#6d5c3b')+rect(0,H-rH,rH,rH,'#bda578','#6d5c3b')+rect(D-rH,H-rH,rH,rH,'#bda578','#6d5c3b');for(let r=0;r<rows;r++){const binY=bottom+r*(binH+gapY),runnerY=binY+binH-rH;s+=rect(zFront+uD+gapD/2,binY,binD,binH,'#e9ecef','#aaa')+rect(zFront,runnerY,runnerD,rH,'#d4b777','#6d5c3b')}s+=`<text x=\"${vw/2}\" y=\"16\" text-anchor=\"middle\" font-size=\"12\" fill=\"#555\">${Math.round(D)} mm</text>`;svg.innerHTML=s}"""

          s,n1=re.subn(r'function drawFront\(svg,c\)\{.*?\nfunction drawSide',front+'\nfunction drawSide',s,count=1,flags=re.S)
          s,n2=re.subn(r'function drawSide\(svg,c\)\{.*?\nfunction update',side+'\nfunction update',s,count=1,flags=re.S)

          # Force Safari/iOS to fetch the new Three.js model instead of a cached old rack3d.js.
          s=re.sub(r'src="\./rack3d\.js(?:\?[^\"]*)?"','src="./rack3d.js?v=ana-white-ladder-1"',s,count=1)

          checks=[n1==1,n2==1,'Tasseaux porteurs latéraux' in s,'Traverses supérieures avant-arrière' not in s,'ana-white-ladder-1' in s]
          if not all(checks):
              raise SystemExit(f'Patch incomplete: {checks} replacements={(n1,n2)}')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm .github/workflows/patch-ana-white-plan.yml
          git commit -m "Use Ana White ladder-style tote supports"
          git push
